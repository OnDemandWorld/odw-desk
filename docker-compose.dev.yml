version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Audit #65: loopback-only — dev credentials must not be reachable from
    # the office network / cloud VM neighbors.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: desk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Audit #96: pinned release — 'latest' silently changed behavior across
    # pulls on unchanged commits.
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: desk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  desk-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: desk-api
    restart: unless-stopped
    # Dev-only reload override (audit #64: not baked into the image).
    command: ["uvicorn", "desk.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://desk:desk@postgres:5432/desk
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: desk-dev
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production-must-be-64-chars}
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
