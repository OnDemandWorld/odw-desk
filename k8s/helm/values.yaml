# Default values for odw-desk
# Single replica: webchat/agent WebSocket registries and runtime-settings
# overrides are process-local (audit #9). Scale out only after adding a
# Redis pub/sub delivery relay and a shared override cache.
replicaCount: 1

image:
  repository: odwai/desk
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: desk.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# PostgreSQL configuration
# Audit #66: do NOT ship working default credentials — override at install
# time (or reference an existing Secret).
postgresql:
  enabled: true
  auth:
    username: desk
    password: ""  # REQUIRED: set a strong password at install time
    database: desk
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Redis configuration
# Audit #66: Redis holds event streams and must not be passwordless.
redis:
  enabled: true
  auth:
    enabled: true
    password: ""  # REQUIRED: set at install time
  master:
    persistence:
      enabled: true
      size: 2Gi

# Application configuration
config:
  environment: production
  debug: false
  logLevel: INFO
  databaseUrl: postgresql+asyncpg://desk:desk@postgresql:5432/desk
  redisUrl: redis://redis-master:6379/0
  # Audit #66/#1: REQUIRED at install time — generate with `openssl rand -hex
  # 32`. A placeholder/padded key is publicly known and lets anyone forge
  # admin JWTs. The app rejects keys shorter than 32 chars at startup.
  secretKey: ""
  # REQUIRED in production: shared key guarding admin/agent APIs. Without it
  # only JWT bearers are accepted (fail closed); set it for shared-key mode.
  deskApiKey: ""
  whatsappAccessToken: ""
  whatsappPhoneNumberId: ""
  whatsappWebhookVerifyToken: ""
  vaultUrl: http://vault:8100
  vaultApiKey: ""
  ollamaEndpoint: http://ollama:11434
  localModelName: llama-3.1-8b
  localModelEnabled: true
  frontierEnabled: false
  frontierProvider: none
  frontierApiKey: ""
  frontierModelName: gpt-4o-mini
